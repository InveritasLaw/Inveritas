<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inveritas — Payment Confirmed</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy-deep:#060E1A;--navy:#0A1628;--navy-mid:#0F2140;
  --gold:#D4A843;--gold-light:#E8C76A;--gold-muted:rgba(212,168,67,0.15);
  --white:#F2F0ED;--white-pure:#FFF;--gray:#8A99AB;--gray-light:#C5CDD8;
  --green:#5DE8A0;
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-body:'DM Sans',-apple-system,sans-serif;
}
body{background:var(--navy-deep);color:var(--white);font-family:var(--font-body);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:9999}
.success-wrap{text-align:center;max-width:560px;padding:3rem 2rem;animation:fadeUp .8s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.success-icon{width:80px;height:80px;border-radius:50%;background:rgba(93,232,160,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 2rem;font-size:2.5rem}
.success-wrap h1{font-family:var(--font-display);font-size:2.2rem;font-weight:600;color:var(--white-pure);margin-bottom:.75rem}
.success-wrap .tier-name{color:var(--gold);font-family:var(--font-display);font-size:1.3rem;font-weight:600;margin-bottom:1.5rem}
.success-wrap p{color:var(--gray-light);font-size:1rem;line-height:1.7;margin-bottom:2rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 2rem;font-family:var(--font-body);font-size:.9rem;font-weight:600;letter-spacing:.04em;text-decoration:none;border-radius:3px;transition:all .3s;cursor:pointer;border:none}
.btn-gold{background:var(--gold);color:var(--navy-deep)}
.btn-gold:hover{background:var(--gold-light);transform:translateY(-1px);box-shadow:0 8px 30px rgba(212,168,67,.3)}
.btn-outline{background:transparent;color:var(--gold);border:1px solid rgba(212,168,67,.3);margin-left:.75rem}
.btn-outline:hover{border-color:var(--gold);background:var(--gold-muted)}
.ctas{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
.session-id{margin-top:2rem;font-size:.7rem;color:rgba(138,153,171,.4);word-break:break-all}
</style>
</head>
<body>
<div class="success-wrap">
  <div class="success-icon">✓</div>
  <h1>Payment Confirmed</h1>
  <div class="tier-name" id="tierName"></div>
  <p>Your access is active. You can now run statutory inversion analyses across all three jurisdictional tiers — federal, state, and municipal.</p>
  <div class="ctas">
    <a href="/analyze.html" class="btn btn-gold">Start Your Analysis →</a>
    <a href="/" class="btn btn-outline">Back to Home</a>
  </div>
  <div class="session-id" id="sessionInfo"></div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const tier = params.get('tier');
const sessionId = params.get('session_id');

const tierNames = {
  single: 'Single Analysis — $29',
  practitioner: 'Practitioner Plan — $297/mo',
  firm: 'Firm Plan — $497/seat/mo'
};

document.getElementById('tierName').textContent = tierNames[tier] || 'Access Activated';
if (sessionId) {
  document.getElementById('sessionInfo').textContent = 'Confirmation: ' + sessionId;
}
</script>
</body>
</html>
